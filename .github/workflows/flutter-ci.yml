name: Flutter CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate missing Android platform files
        run: |
          flutter create --platforms=android --project-name=monday_app .
      - name: Pin AGP and Kotlin to a known-stable combo
        run: |
          echo "--- settings.gradle.kts BEFORE patch ---"
          cat android/settings.gradle.kts
          sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/' android/settings.gradle.kts
          sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.1.20"/' android/settings.gradle.kts
          echo "--- settings.gradle.kts AFTER patch ---"
          cat android/settings.gradle.kts
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: monday-apk
          path: build/app/outputs/flutter-apk/app-release.apk
